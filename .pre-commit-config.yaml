minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format validation
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: type-check
        name: Static type contracts
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: repository-policy
        name: Documentation and dependency boundaries
        entry: uv run --locked python scripts/check_policy.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commit-text-policy
        name: Commit text policy
        entry: uv run --locked python scripts/check_policy.py
        language: system
        stages: [commit-msg]
