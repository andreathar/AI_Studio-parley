name: Issue hygiene

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to validate
        required: true
        type: string
  issues:
    types: [opened, reopened, edited, labeled, unlabeled, assigned,
            unassigned, milestoned, demilestoned]

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-hygiene-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  issue-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate live issue metadata with read-only permissions
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: python3 -m scripts.check_issue_hygiene
