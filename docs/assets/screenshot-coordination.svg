<svg xmlns="http://www.w3.org/2000/svg" width="1067" height="966" viewBox="0 0 1067 966" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<rect width="1067" height="966" rx="10" fill="#0d1117"/>
<rect width="1067" height="30" rx="10" fill="#161b22"/>
<rect y="20" width="1067" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
<text x="533.5" y="19" text-anchor="middle" fill="#8b949e" font-size="12">16 scoped MCP tools</text>
<text x="18.0" y="48.0" xml:space="preserve" fill="#c9d1d9"># the agent reserves the file it is about to change</text>
<text x="18.0" y="66.0" xml:space="preserve"><tspan fill="#d2a8ff">claude-1 </tspan><tspan fill="#e6edf3">file_reservation_paths {"paths": ["src/payments/refund.py"], "exclusive": true, "reason": "refund rounding fix"}</tspan></text>
<text x="18.0" y="84.0" xml:space="preserve" fill="#c9d1d9">{</text>
<text x="18.0" y="102.0" xml:space="preserve" fill="#c9d1d9">  "granted": [</text>
<text x="18.0" y="120.0" xml:space="preserve" fill="#c9d1d9">    {</text>
<text x="18.0" y="138.0" xml:space="preserve" fill="#c9d1d9">      "id": 2,</text>
<text x="18.0" y="156.0" xml:space="preserve" fill="#c9d1d9">      "path": "src/payments/refund.py"</text>
<text x="18.0" y="174.0" xml:space="preserve" fill="#c9d1d9">    }</text>
<text x="18.0" y="192.0" xml:space="preserve" fill="#c9d1d9">  ],</text>
<text x="18.0" y="210.0" xml:space="preserve" fill="#ff7b72">  "conflicts": []</text>
<text x="18.0" y="228.0" xml:space="preserve" fill="#c9d1d9">}</text>
<text x="18.0" y="246.0" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="264.0" xml:space="preserve" fill="#c9d1d9"># a second agent asks for the same path and is granted nothing</text>
<text x="18.0" y="282.0" xml:space="preserve"><tspan fill="#d2a8ff">codex-1 </tspan><tspan fill="#e6edf3">file_reservation_paths {"paths": ["src/payments/refund.py"], "exclusive": true, "reason": "shared helper rename"}</tspan></text>
<text x="18.0" y="300.0" xml:space="preserve" fill="#c9d1d9">{</text>
<text x="18.0" y="318.0" xml:space="preserve" fill="#c9d1d9">  "granted": [],</text>
<text x="18.0" y="336.0" xml:space="preserve" fill="#ff7b72">  "conflicts": [</text>
<text x="18.0" y="354.0" xml:space="preserve" fill="#c9d1d9">    {</text>
<text x="18.0" y="372.0" xml:space="preserve" fill="#c9d1d9">      "path": "src/payments/refund.py",</text>
<text x="18.0" y="390.0" xml:space="preserve" fill="#c9d1d9">      "owner": "claude-1",</text>
<text x="18.0" y="408.0" xml:space="preserve" fill="#c9d1d9">      "reason": "refund rounding fix"</text>
<text x="18.0" y="426.0" xml:space="preserve" fill="#c9d1d9">    }</text>
<text x="18.0" y="444.0" xml:space="preserve" fill="#c9d1d9">  ],</text>
<text x="18.0" y="462.0" xml:space="preserve" fill="#c9d1d9">  "has_more": false</text>
<text x="18.0" y="480.0" xml:space="preserve" fill="#c9d1d9">}</text>
<text x="18.0" y="498.0" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="516.0" xml:space="preserve" fill="#c9d1d9"># messages are addressed by participant name and carry an acknowledgement flag</text>
<text x="18.0" y="534.0" xml:space="preserve"><tspan fill="#d2a8ff">claude-1 </tspan><tspan fill="#e6edf3">send_message {"to": ["codex-1"], "subject": "Refund path needs a second pass", "body_md": "Rounding fixed in refund.py; capture path still needs a review.", "idempotency_key": "screenshot-1", "ack_required": true}</tspan></text>
<text x="18.0" y="552.0" xml:space="preserve" fill="#c9d1d9">{</text>
<text x="18.0" y="570.0" xml:space="preserve" fill="#c9d1d9">  "id": 1,</text>
<text x="18.0" y="588.0" xml:space="preserve" fill="#c9d1d9">  "thread_id": "991c9d7afbd02635691dffe1ce17f41e"</text>
<text x="18.0" y="606.0" xml:space="preserve" fill="#c9d1d9">}</text>
<text x="18.0" y="624.0" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="642.0" xml:space="preserve" fill="#c9d1d9"># inboxes page incrementally and never mark a message read</text>
<text x="18.0" y="660.0" xml:space="preserve"><tspan fill="#d2a8ff">codex-1 </tspan><tspan fill="#e6edf3">fetch_inbox {"limit": 5}</tspan></text>
<text x="18.0" y="678.0" xml:space="preserve" fill="#c9d1d9">{</text>
<text x="18.0" y="696.0" xml:space="preserve" fill="#c9d1d9">  "messages": [</text>
<text x="18.0" y="714.0" xml:space="preserve" fill="#c9d1d9">    {</text>
<text x="18.0" y="732.0" xml:space="preserve" fill="#c9d1d9">      "id": 1,</text>
<text x="18.0" y="750.0" xml:space="preserve" fill="#c9d1d9">      "sender": "claude-1",</text>
<text x="18.0" y="768.0" xml:space="preserve" fill="#c9d1d9">      "thread_id": "991c9d7afbd02635691dffe1ce17f41e",</text>
<text x="18.0" y="786.0" xml:space="preserve" fill="#c9d1d9">      "subject": "Refund path needs a second pass",</text>
<text x="18.0" y="804.0" xml:space="preserve" fill="#c9d1d9">      "ack_required": 1,</text>
<text x="18.0" y="822.0" xml:space="preserve" fill="#c9d1d9">      "read_ts": null,</text>
<text x="18.0" y="840.0" xml:space="preserve" fill="#c9d1d9">      "ack_ts": null</text>
<text x="18.0" y="858.0" xml:space="preserve" fill="#c9d1d9">    }</text>
<text x="18.0" y="876.0" xml:space="preserve" fill="#c9d1d9">  ],</text>
<text x="18.0" y="894.0" xml:space="preserve" fill="#c9d1d9">  "next_after_id": 1,</text>
<text x="18.0" y="912.0" xml:space="preserve" fill="#c9d1d9">  "has_more": false</text>
<text x="18.0" y="930.0" xml:space="preserve" fill="#c9d1d9">}</text>
</svg>
