  </defs>
  <rect x="8" y="8" width="644" height="152" rx="32" fill="#111b2d"/>
  <path d="M42 113V79c0-22 18-40 40-40h36" fill="none" stroke="url(#blue)" stroke-width="13" stroke-linecap="round"/>
